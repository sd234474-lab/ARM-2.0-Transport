server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    add_header X-ARM2-UAT ARM2-WIN-UAT-R2-001 always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    # API wrapper also enforces the method/path allowlist. No other proxy upstream.
    location /api/ {
        proxy_pass http://uat-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location / {
        sub_filter_once on;
        sub_filter '</body>' '<aside style="position:fixed;bottom:0;right:0;z-index:99999;background:#542;color:white;padding:6px">ARM2-WIN-UAT-R2-001 · TEST ONLY · source 1f8c06d · <a style="color:white" href="/uat-instance.json">instance</a></aside></body>';
        try_files $uri $uri/ /index.html;
    }
}
